<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamiento CSS</title>
    <meta name="author" content="Alexandra Arellano">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header id="encabezado">
        <section class="logo">
            <img src="imagenes/logo.jpg" alt="gato con celular">
        </section>
        <h1>Posicionamiento en CSS</h1>
        <nav id="navegacion">
            <ul>
                <li><a href="#">Link 1</a></li>
                <li><a href="#">Link 2</li>
                <li><a href="#">Link 3</li>
            </ul>
        </nav>
    </header>
    <main id="elementos-posicionados">
        <section class="gato-sentado">
            <img src="imagenes/gato1.jpg" alt="gato sentado">
        </section>
        <section class="gato-naranja">
            <img src="imagenes/gato2.jpg" alt="gato naranja">
        </section>
        <section class="gato-asustado">
            <img src="imagenes/gato3.jpg" alt="gato asustado">
        </section>
        <section class="gato-zoom">
            <img src="imagenes/gato4.jpg" alt="gato en 0.5">
        </section>
    </main>
</body>
</html>
